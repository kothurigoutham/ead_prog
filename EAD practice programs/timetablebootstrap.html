    <!DOCTYPE html>
    <html>
    <head>
        <title>Time Table</title>

        <style>
            .row{
                display: flex;
            }

            .col{
                border: 1px solid black;
                padding: 10px;
                width: 100px;
                text-align: center;
            }

            .lunch{
                background-color: lightyellow;
            }
        </style>
    </head>
    <body>

    <h2>Time Table</h2>

    <!-- Header -->
    <div class="row" style="font-weight: bold;background-color: lightgray;">
        <div class="col">Day</div>
        <div class="col">9-10</div>
        <div class="col">10-11</div>
        <div class="col">11-12</div>
        <div class="col">12-1</div>
        <div class="col">1-2</div>
    </div>

    <!-- Monday -->
    <div class="row">
        <div class="col">Mon</div>
        <div class="col">Math</div>
        <div class="col">Phy</div>
        <div class="col lunch">Lunch</div>
        <div class="col">Eng</div>
        <div class="col">CS</div>
    </div>

    <!-- Tuesday -->
    <div class="row">
        <div class="col">Tue</div>
        <div class="col">Bio</div>
        <div class="col">Math</div>
        <div class="col lunch">Lunch</div>
        <div class="col">Sports</div>
        <div class="col">Lab</div>
    </div>

    <!-- Wednesday -->
    <div class="row">
        <div class="col">Wed</div>
        <div class="col">Eng</div>
        <div class="col">Chem</div>
        <div class="col lunch">Lunch</div>
        <div class="col">Math</div>
        <div class="col">Lab</div>
    </div>

    <!-- Thursday -->
    <div class="row">
        <div class="col">Thu</div>
        <div class="col">CS</div>
        <div class="col">Math</div>
        <div class="col lunch">Lunch</div>
        <div class="col">Phy</div>
        <div class="col">Sports</div>
    </div>

    <!-- Friday -->
    <div class="row">
        <div class="col">Fri</div>
        <div class="col">Math</div>
        <div class="col">Bio</div>
        <div class="col lunch">Lunch</div>
        <div class="col">Chem</div>
        <div class="col">Eng</div>
    </div>

    <!-- Saturday -->
    <div class="row">
        <div class="col">Sat</div>
        <div class="col">Lab</div>
        <div class="col">CS</div>
        <div class="col lunch">Lunch</div>
        <div class="col">Math</div>
        <div class="col">Sports</div>
    </div>

    </body>
    </html>
