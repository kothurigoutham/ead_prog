<!DOCTYPE html>
<html>
<body>

<h2>Prime Number Check</h2>

<input type="number" id="num" placeholder="Enter number">
<button onclick="checkPrime()">Check</button>

<script>
function checkPrime(){
    let n = document.getElementById("num").value;
    let isPrime = true;

    if(n <= 1){
        isPrime = false;
    } else {
        for(let i = 2; i < n; i++){
            if(n % i == 0){
                isPrime = false;
                break;
            }
        }
    }

    if(isPrime)
        alert(n + " is Prime");
    else
        alert(n + " is Not Prime");
}
</script>

</body>
</html>
